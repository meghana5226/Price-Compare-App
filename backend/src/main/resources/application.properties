spring.application.name=price-compare-backend

# --- Zero-config H2 in-memory database ---
# Data resets each restart and is reseeded from data.sql automatically.
spring.datasource.url=jdbc:h2:mem:pricecompare;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 web console at http://localhost:8080/h2-console (jdbc url: jdbc:h2:mem:pricecompare)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

server.port=8080

# Base URL of the Python AI microservice (ai-service/)
ai.service.base-url=http://localhost:5001
